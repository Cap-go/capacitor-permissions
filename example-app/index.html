<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>@capgo/capacitor-permissions</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-permissions</h1>
      <p class="lead">Exercise every plugin method and every supported permission name.</p>

      <label for="permission-select">Permission</label>
      <select id="permission-select"></select>

      <div class="actions">
        <button id="check-one" type="button">Check</button>
        <button id="request-one" type="button">Request</button>
        <button id="check-several" type="button">Check all</button>
        <button id="request-several" type="button">Request all</button>
        <button id="rationale" type="button">Rationale</button>
        <button id="open-settings" type="button">App settings</button>
        <button id="open-notification-settings" type="button">Notification settings</button>
        <button id="precise-location" type="button">Precise location</button>
        <button id="get-version" type="button">Get version</button>
      </div>

      <pre id="plugin-output">Press a button to run an action.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
